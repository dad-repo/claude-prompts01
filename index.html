      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s;

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .card-title i {
      font-size: 16px;
      color: var(--text-secondary);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 400;
    }

    .badge-char { background: var(--bg-info); color: var(--text-info); }
    .badge-time { background: #EAF3DE; color: #3B6D11; }
    .badge-check { background: #FAEEDA; color: #854F0B; }
    .badge-copy { background: var(--bg-secondary); color: var(--text-secondary); }

    @media (prefers-color-scheme: dark) {
      .badge-time { background: #1a2e0f; color: #97c459; }
      .badge-check { background: #2e1f08; color: #ef9f27; }
    }

      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 0 16px 10px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }

    .full-text {
      display: none;
      font-size: 11px;
      line-height: 1.7;
      color: var(--text-secondary);
      padding: 12px 16px;
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
      border-top: 0.5px solid var(--border);
    }

    .full-text.open { display: block; }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 14px;
      border-top: 0.5px solid var(--border);
    }

    .expand-btn {
      font-size: 12px;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }

    .expand-btn:hover { color: var(--text-primary); }

    .expand-btn i { transition: transform 0.2s; }

    .copy-btn {
      font-size: 12px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-secondary);
      border-radius: var(--radius-md);
      padding: 5px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-primary);
      transition: background 0.15s;

      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg);
      border: 0.5px solid var(--border-secondary);
      border-radius: var(--radius-md);

      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

const grid = document.getElementById("grid");

prompts.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  const previewText = p.text.split('\n').slice(0, 4).join('\n');
  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">
        <i class="ti ${p.icon}"></i>
        ${p.title}
      </div>
      <span class="badge ${p.badge}">${p.badgeLabel}</span>
    </div>
    <div class="preview">${previewText}</div>
    <div class="full-text" id="full-${i}">${p.text}</div>
    <div class="card-foot">
      <button class="expand-btn" onclick="toggleExpand(${i}, this)">
        <i class="ti ti-chevron-down" id="chevron-${i}"></i> 展開
      </button>
      <button class="copy-btn" id="copybtn-${i}" onclick="copyPrompt(${i})">
        <i class="ti ti-copy"></i> コピー
      </button>
    </div>
  `;
  grid.appendChild(card);
});

function toggleExpand(i, btn) {
  const full = document.getElementById("full-" + i);
  const chevron = document.getElementById("chevron-" + i);
  const isOpen = full.classList.toggle("open");
  chevron.style.transform = isOpen ? "rotate(180deg)" : "";
  btn.childNodes[2].textContent = isOpen ? " 閉じる" : " 展開";
}

function copyPrompt(i) {
  const text = prompts[i].text.replace(/\\t/g, '\t');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copybtn-" + i);
    btn.classList.add("done");
    btn.innerHTML = '<i class="ti ti-check"></i> コピー済み';
    setTimeout(() => {
      btn.classList.remove("done");
      btn.innerHTML = '<i class="ti ti-copy"></i> コピー';
    }, 2000);
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  });
}
